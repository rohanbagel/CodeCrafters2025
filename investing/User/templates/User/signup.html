{% comment %} {% extends 'User/base.html' %} {% endcomment %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#0F0F11] py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white/5 p-8 rounded-2xl backdrop-blur-lg border border-white/10">
        <div>
            <div class="flex justify-center">
                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-[#d6ff63] to-[#96c718] shadow-lg shadow-[#BFE953]/30 ring-4 ring-[#BFE953]/20">
                    <i data-lucide="user-plus" class="h-6 w-6 text-[#0F0F11]"></i>
                </div>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-[#F6F6F5]">Create your account</h2>
            <p class="mt-2 text-center text-sm text-[#F6F6F5]/60">
                Already have an account?
                <a href="{% url 'login' %}" class="font-medium text-[#BFE953] hover:text-[#d6ff63]">Sign in</a>
            </p>
        </div>
        <form class="mt-8 space-y-6" action="{% url 'signup' %}" method="POST">
            {% csrf_token %}
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" name="username" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-white/10 placeholder-[#F6F6F5]/40 text-[#F6F6F5] rounded-t-md bg-white/5 focus:outline-none focus:ring-[#BFE953] focus:border-[#BFE953] focus:z-10 sm:text-sm" placeholder="Username">
                </div>
                <div>
                    <label for="password1" class="sr-only">Password</label>
                    <input id="password1" name="password1" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-white/10 placeholder-[#F6F6F5]/40 text-[#F6F6F5] bg-white/5 focus:outline-none focus:ring-[#BFE953] focus:border-[#BFE953] focus:z-10 sm:text-sm" placeholder="Password">
                </div>
                <div>
                    <label for="password2" class="sr-only">Confirm Password</label>
                    <input id="password2" name="password2" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-white/10 placeholder-[#F6F6F5]/40 text-[#F6F6F5] rounded-b-md bg-white/5 focus:outline-none focus:ring-[#BFE953] focus:border-[#BFE953] focus:z-10 sm:text-sm" placeholder="Confirm Password">
                </div>
            </div>

            {% if messages %}
            <div class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">
                            {% for message in messages %}
                                {{ message }}
                            {% endfor %}
                        </h3>
                    </div>
                </div>
            </div>
            {% endif %}

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-[#0F0F11] bg-[#BFE953] hover:bg-[#d6ff63] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#BFE953] transition-all duration-300">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i data-lucide="user-plus" class="h-5 w-5 text-[#0F0F11] group-hover:text-[#0F0F11]/70"></i>
                    </span>
                    Create Account
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();
</script>
{% endblock %}
