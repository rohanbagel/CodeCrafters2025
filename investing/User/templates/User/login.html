<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfitPulse - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load socialaccount %}
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0F0F11;
            color: #F6F6F5;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
<div class="min-h-screen flex items-center justify-center bg-[#0F0F11] py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white/5 p-8 rounded-2xl backdrop-blur-lg border border-white/10">
        <div>
            <div class="flex justify-center">
                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-[#d6ff63] to-[#96c718] shadow-lg shadow-[#BFE953]/30 ring-4 ring-[#BFE953]/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-[#0F0F11]"><path d="m22 7-8.5 8.5-5-5L2 17"></path><path d="M16 7h6v6"></path></svg>
                </div>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-[#F6F6F5]">Sign in to your account</h2>
            <p class="mt-2 text-center text-sm text-[#F6F6F5]/60">
                Or
                <a href="{% url 'signup' %}" class="font-medium text-[#BFE953] hover:text-[#d6ff63]">create a new account</a>
            </p>
        </div>

        <!-- Google OAuth Button -->
        <div class="flex flex-col gap-4">
            <a href="{% provider_login_url 'google' %}" class="flex items-center justify-center gap-3 w-full py-2.5 border border-white/10 rounded-lg bg-white/5 text-[#F6F6F5] hover:bg-white/10 transition-all duration-300">
                <svg class="h-5 w-5" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>
        </div>

        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/10"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-[#0F0F11] text-[#F6F6F5]/60">Or continue with</span>
            </div>
        </div>

        <form class="mt-8 space-y-6" action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" name="username" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-white/10 placeholder-[#F6F6F5]/40 text-[#F6F6F5] rounded-t-md bg-white/5 focus:outline-none focus:ring-[#BFE953] focus:border-[#BFE953] focus:z-10 sm:text-sm" placeholder="Username">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-white/10 placeholder-[#F6F6F5]/40 text-[#F6F6F5] rounded-b-md bg-white/5 focus:outline-none focus:ring-[#BFE953] focus:border-[#BFE953] focus:z-10 sm:text-sm" placeholder="Password">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox" class="h-4 w-4 text-[#BFE953] bg-white/5 border-white/10 rounded focus:ring-[#BFE953]">
                    <label for="remember_me" class="ml-2 block text-sm text-[#F6F6F5]/60">Remember me</label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-medium text-[#BFE953] hover:text-[#d6ff63]">Forgot your password?</a>
                </div>
            </div>

            {% if messages %}
            <div class="rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">
                            {% for message in messages %}
                                {{ message }}
                            {% endfor %}
                        </h3>
                    </div>
                </div>
            </div>
            {% endif %}

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-[#0F0F11] bg-[#BFE953] hover:bg-[#d6ff63] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#BFE953] transition-all duration-300">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-[#0F0F11] group-hover:text-[#0F0F11]/70"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    Sign in
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
